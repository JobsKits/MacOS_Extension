<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'none'; img-src 'none'"><link rel="stylesheet" href="xterm.css"><style>html,body,#terminal{width:100%;height:100%;margin:0;overflow:hidden;background:#15171c}#terminal{padding:8px;box-sizing:border-box}</style></head><body><div id="terminal"></div><script src="xterm.js"></script><script src="addon-fit.js"></script><script>
'use strict';
const term=new Terminal({cursorBlink:true,convertEol:false,scrollback:50000,fontFamily:'Menlo, monospace',fontSize:13,allowProposedApi:false,theme:{background:'#15171c',foreground:'#e7e9ee',cursor:'#8be9fd'}});
const fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open(document.getElementById('terminal'));
const bridge=window.webkit.messageHandlers.pty;
term.onData(data=>bridge.postMessage({type:'input',data}));
term.onBinary(data=>bridge.postMessage({type:'binary',data}));
term.onResize(size=>bridge.postMessage({type:'resize',cols:size.cols,rows:size.rows}));
window.feedPTY=base64=>term.write(Uint8Array.from(atob(base64),x=>x.charCodeAt(0)));
window.focusPTY=()=>term.focus();
let ready=false;new ResizeObserver(()=>{fit.fit();if(!ready){ready=true;bridge.postMessage({type:'ready',cols:term.cols,rows:term.rows});term.focus();}}).observe(document.getElementById('terminal'));
</script></body></html>
